<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Swe Voronoi</title>

    <link rel="shortcut icon" href="https://www.viltstigen.se/favicon.png">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-geo-voronoi@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"
            integrity="sha512-wNH6xsp2n8CfB91nrBtfc4sfLwYPBMjSWVUwQOp60AYYXH6i8yCwuKFZ4rgK2i6pQek/b+bSyR7b01/922IBzQ=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <style>
        /* Tooltip styling */
        .tooltip {
            position: absolute;
            background-color: white;
            border: 1px solid #999;
            padding: 5px 8px;
            border-radius: 3px;
            pointer-events: none;
            font-size: 12px;
            color: black;
            opacity: 0.9;
        }
    </style>
</head>

<body>
<div class="container text-center">
    <h2 id="header"></h2>
    <br><br>
    <hr>

    <div class='row'>
        <div class="col-12" id="map"></div>
    </div>

    <br><br>
    <hr>
    <footer>
        <p style="font-size:12px">
            Copyright (C) Mats Melander
        </p>
    </footer>
</div>

<script>
function values(series, key) {
    let max_val, min_val;
    series[key].every(v => {
        if (v.active) {
            max_val = v.val;
            min_val = v.val;
            return false;
        }
        return true;
    });
    let stations = [];

    series[key].forEach(function (p) {
        const lon = Math.round(p.lon * 100) / 100;
        const lat = Math.round(p.lat * 100) / 100;
        let found = stations.find(elem => elem.lon === lon && elem.lat === lat);
        if (!found && p.active) {
            stations.push({
                lon: lon,
                lat: lat,
                station: p.station,
                val: p.val,
            });
            max_val = Math.max(max_val, p.val);
            min_val = Math.min(min_val, p.val);
        }
    });
    return {key: key, stns: stations, max: max_val, min: min_val, date: series.date};
}

$(document).ready(function () {
    $.when(
        $.get('clover/files/weather.json'),
        $.get('clover/files/se.json')
    ).done(function (data, se) {
        const key = 'temp';
        if (!(key in data[0])) {
            console.log(data);
            return;
        }
        let date = new Date(data[0].date);
        d3.select("#header").text("Temperatures " + date.toLocaleString("sv-SV"));

        // Map dimensions
        let screenWidth  = window.innerWidth;
        let screenHeight = window.innerHeight;
        let maxWidth     = 900;

        let containerWidth  = Math.min(document.getElementById('map').clientWidth, maxWidth);
        let availableHeight = screenHeight * 0.75; // leave room for header/footer
        let mapHeight       = Math.min(containerWidth * 1.2, availableHeight);

        const geojson_swe = topojson.feature(se[0], se[0].objects.subunits);
        let points = values(data[0], key);

        let colorScale = d3.scaleSequential()
            .interpolator(d3.interpolateRdYlBu)
            .domain([points.max, points.min]);

        let voronoi = d3.geoVoronoi().x(d => d.lon).y(d => d.lat);
        let projection = d3.geoEqualEarth();
        projection.fitSize([containerWidth, mapHeight], geojson_swe);
        let path = d3.geoPath().projection(projection);

        let svg = d3.select("#map")
            .append("svg")
            .attr("width", (screenWidth > 768 ? containerWidth + 120 : containerWidth))
            .attr("height", mapHeight);

        // Draw Sweden boundaries
        svg.append('g').selectAll('path')
            .data(geojson_swe.features)
            .join('path')
            .attr('d', path)
            .style("fill", "#eee")
            .style("stroke", "#333");

        // ClipPath for Voronoi
        svg.append('defs')
            .selectAll("clipPath")
            .data(geojson_swe.features)
            .enter()
            .append("clipPath")
            .attr("id", "swe-clip")
            .append("path")
            .attr("d", path);

        // Voronoi cells
        let cells = voronoi(points.stns).polygons();
        svg.append('g').selectAll("path")
            .data(cells.features)
            .enter()
            .append("path")
            .attr("clip-path", "url(#swe-clip)")
            .attr("d", path)
            .style('fill', (_, i) => colorScale(points.stns[i].val))
            .style('stroke', '#555')
            .style('stroke-width', 0.5)
            .on("mousemove touchmove", function(event, d) {
                const i = cells.features.indexOf(d);
                let tooltip = d3.select("#map").selectAll(".tooltip").data([points.stns[i]]);
                tooltip.enter().append("div").attr("class", "tooltip").merge(tooltip)
                    .html(points.stns[i].station + "<br>Temp: " + points.stns[i].val)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY + 10) + "px")
                    .style("display", "block");
            })
            .on("mouseout touchend", function() {
                d3.select("#map").selectAll(".tooltip").style("display", "none");
            });

        // Define legend
        let legend = d3.legendColor()
            .labelFormat(d3.format(".0f"))
            .cells(10)
            .scale(colorScale);

        if (screenWidth >= 1024) {
            legend.orient("vertical");
            svg.append("g")
                .attr("class", "legend")
                .attr("transform", `translate(${containerWidth + 20},20)`)
                .call(legend);
        } else {
            legend.orient("horizontal");
            let legendSvg = d3.select("#map")
                .append("svg")
                .attr("width", containerWidth)
                .attr("height", 90)
                .append("g")
                .attr("class", "legend")
                .attr("transform", "translate(20,40)");
            legendSvg.call(legend);
        }

        window.addEventListener("resize", () => {
            location.reload();
        });
    });
});
</script>


</body>
</html>
