<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swe Voronoi</title>
<link rel="shortcut icon" href="https://www.viltstigen.se/favicon.png">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://d3js.org/topojson.v1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  .tooltip {
    position: absolute;
    text-align: left;
    padding: 5px;
    font: 12px sans-serif;
    background: white;
    border: 1px solid #666;
    border-radius: 3px;
    pointer-events: none;
    opacity: 0;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
<div class="container text-center">
  <h2 id="header"></h2>
  <br><br>
  <hr>
  <div class='row'>
      <div class="col-xs-12" id="map"></div>
  </div>
  <br><br>
  <hr>
  <footer>
      <p style="font-size:12px">
          Copyright (C) Mats Melander
      </p>
  </footer>
</div>

<script>
function values(series, key) {
    let max_val, min_val;
    series[key].every(v => {
        if (v.active) { max_val = min_val = v.val; return false; }
        return true;
    });
    let stations = [];
    series[key].forEach(p => {
        const lon = Math.round(p.lon * 100) / 100;
        const lat = Math.round(p.lat * 100) / 100;
        let found = stations.find(elem => elem.lon === lon && elem.lat === lat);
        if (!found && p.active) {
            stations.push({lon, lat, station: p.station, val: p.val});
            max_val = Math.max(max_val, p.val);
            min_val = Math.min(min_val, p.val);
        }
    });
    return {key, stns: stations, max: max_val, min: min_val, date: series.date};
}

$(document).ready(function () {
    $.when(
        $.get('clover/files/weather.json'),
        $.get('clover/files/se.json')
    ).done(function (data, se) {
        const key = 'temp';
        if (!(key in data[0])) return;

        let date = new Date(data[0].date);
        d3.select("#header").text("Temperatures " + date.toLocaleString("sv-SV"));

        let containerWidth = Math.min(800, document.getElementById('map').clientWidth);
        let mapHeight = containerWidth;

        const geojson_swe = topojson.feature(se[0], se[0].objects.subunits);
        let points = values(data[0], key);
        let colorScale = d3.scaleSequential().interpolator(d3.interpolateSpectral).domain([points.max, points.min]);

        let projection = d3.geoEqualEarth();
        projection.fitSize([containerWidth, mapHeight], geojson_swe);
        let path = d3.geoPath().projection(projection);

        let svg = d3.select("#map").append("svg")
            .attr("width", containerWidth)
            .attr("height", mapHeight);

        // Sweden map
        svg.append('g').selectAll('path')
            .data(geojson_swe.features)
            .join('path')
            .attr('d', path)
            .style("fill", "#eee")
            .style("stroke", "#333");

        // ClipPath for Voronoi
        svg.append('defs').append('clipPath')
            .attr('id', 'swe-clip')
            .append('path')
            .attr('d', path(geojson_swe));

        // Tooltip
        let tooltip = d3.select("body").append("div").attr("class", "tooltip");

        // Voronoi diagram
        let delaunay = d3.Delaunay.from(points.stns,
            d => projection([d.lon,d.lat])[0],
            d => projection([d.lon,d.lat])[1]);
        let voronoiPolygons = delaunay.voronoi([0,0,containerWidth,mapHeight]);

        svg.append('g')
            .attr("clip-path", "url(#swe-clip)")
            .selectAll("path")
            .data(points.stns)
            .enter()
            .append("path")
            .attr("d", (d,i) => voronoiPolygons.renderCell(i))
            .style('fill', d => colorScale(d.val))
            .style('stroke', '#666')
            .style('stroke-width', 0.5)
            .on("mouseover touchstart", function(event,d) {
                tooltip.style("opacity", 1)
                    .html(d.station + "<br>Temp: " + d.val)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 25) + "px");
            })
            .on("mousemove touchmove", function(event) {
                tooltip.style("left", (event.pageX + 10) + "px")
                       .style("top", (event.pageY - 25) + "px");
            })
            .on("mouseout touchend", function() {
                tooltip.style("opacity", 0);
            });

        // Legend
        let legendX = containerWidth + 10;
        let legendY = 20;
        let legendCells = 10;
        let legend = d3.legendColor()
            .labelFormat(d3.format(".0f"))
            .cells(legendCells)
            .scale(colorScale)
            .orient("vertical");

        svg.append("g")
            .attr("class", "legend")
            .attr("transform", `translate(${legendX},${legendY})`)
            .call(legend)
            .selectAll("text").style("font-size", "12px");

        // Responsive resize
        window.addEventListener("resize", () => {
            let w = Math.min(800, document.getElementById('map').clientWidth);
            svg.attr("width", w).attr("height", w);
        });
    });
});
</script>
</body>
</html>
