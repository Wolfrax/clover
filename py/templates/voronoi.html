<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Swe Voronoi</title>

    <link rel="shortcut icon" href="https://www.viltstigen.se/favicon.png">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-geo-voronoi@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"
            integrity="sha512-wNH6xsp2n8CfB91nrBtfc4sfLwYPBMjSWVUwQOp60AYYXH6i8yCwuKFZ4rgK2i6pQek/b+bSyR7b01/922IBzQ=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">

    <style>
        .tooltip {
            position: absolute;
            background-color: white;
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 4px;
            pointer-events: none;
            font-size: 12px;
            opacity: 0.95;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>
<div class="container text-center">
    <h2 id="header"></h2>
    <br><br>
    <hr>

    <div class='row'>
        <div class="col-12" id="map"></div>
    </div>

    <br><br>
    <hr>
    <footer>
        <p style="font-size:12px">
            Copyright (C) Mats Melander
        </p>
    </footer>
</div>

<script>
function values(series, key) {
    let max_val, min_val;
    series[key].every(v => {
        if (v.active) {
            max_val = v.val;
            min_val = v.val;
            return false;
        }
        return true;
    });
    let stations = [];
    series[key].forEach(function (p) {
        const lon = Math.round(p.lon * 100) / 100;
        const lat = Math.round(p.lat * 100) / 100;
        let found = stations.find(elem => elem.lon === lon) && stations.find(elem => elem.lat === lat);
        if (!found && p.active) {
            stations.push({lon, lat, station: p.station, val: p.val});
            max_val = Math.max(max_val, p.val);
            min_val = Math.min(min_val, p.val);
        }
    });
    return {key: key, stns: stations, max: max_val, min: min_val, date: series.date};
}

$(document).ready(function () {
    $.when(
        $.get('clover/files/weather.json'),
        $.get('clover/files/se.json')
    ).done(function (data, se) {
        const key = 'temp';
        if (!(key in data[0])) { console.log(data); return; }

        let date = new Date(data[0].date);
        d3.select("#header").text("Temperatures " + date.toLocaleString("sv-SV"));

        let containerWidth = document.getElementById('map').clientWidth;
        let mapHeight = containerWidth * 1.1;

        const geojson_swe = topojson.feature(se[0], se[0].objects.subunits);
        let points = values(data[0], key);

        // Blue = cold, Red = hot
        let colorScale = d3.scaleSequential(d3.interpolateRdBu).domain([points.max, points.min]);

        let projection = d3.geoEqualEarth();
        projection.fitSize([containerWidth, mapHeight], geojson_swe);
        let path = d3.geoPath().projection(projection);

        let svg = d3.select("#map")
            .append("svg")
            .attr("width", containerWidth)
            .attr("height", mapHeight);

        // Sweden base map
        svg.append('g').selectAll('path')
            .data(geojson_swe.features)
            .join('path')
            .attr('d', path)
            .style("fill", "#eee")
            .style("stroke", "#333");

        // Voronoi diagram
        const voronoi = d3.geoVoronoi().x(d => d.lon).y(d => d.lat);
        let voronoiPolygons = voronoi(points.stns).polygons().features;

        svg.append('defs')
            .selectAll("clipPath")
            .data(geojson_swe.features)
            .enter()
            .append("clipPath")
            .attr("id", "swe-clip")
            .append("path")
            .attr("d", path);

        svg.append('g').selectAll("path.voronoi")
            .data(voronoiPolygons)
            .enter()
            .append("path")
            .attr("clip-path", "url(#swe-clip)")
            .attr("d", path)
            .attr("class", "voronoi")
            .style('fill', (_, i) => colorScale(points.stns[i].val))
            .style('stroke', '#555')
            .style('stroke-width', 0.5)
            .on("mouseenter touchstart", function (event, d) {
                let i = voronoiPolygons.indexOf(d);
                tooltip.style("display", "block")
                       .html(points.stns[i].station + "<br>Temp: " + points.stns[i].val)
                       .style("left", (event.pageX + 10) + "px")
                       .style("top", (event.pageY - 20) + "px");
            })
            .on("mousemove touchmove", function (event) {
                tooltip.style("left", (event.pageX + 10) + "px")
                       .style("top", (event.pageY - 20) + "px");
            })
            .on("mouseleave touchend", function () {
                tooltip.style("display", "none");
            });

        // Tooltip div
        const tooltip = d3.select("body").append("div")
            .attr("class", "tooltip")
            .style("display", "none");

        // Legend
        let legendGroup = svg.append("g")
            .attr("class", "legend")
            .attr("transform", `translate(${containerWidth - 80}, 20)`);

        let legend = d3.legendColor()
            .cells(10)
            .scale(colorScale)
            .orient("vertical");

        legendGroup.call(legend);

        // Resize SVG on window resize
        window.addEventListener("resize", () => {
            let w = document.getElementById('map').clientWidth;
            let h = w * 1.1;
            svg.attr("width", w).attr("height", h);
            projection.fitSize([w, h], geojson_swe);
            svg.selectAll('path').attr('d', path);
        });
    });
});
</script>
</body>
</html>
