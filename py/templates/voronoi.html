<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swe Voronoi</title>
  <link rel="shortcut icon" href="https://www.viltstigen.se/favicon.png">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/d3-voronoi.v1.min.js"></script>
  <script src="https://d3js.org/topojson.v1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo-voronoi@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"
          integrity="sha512-wNH6xsp2n8CfB91nrBtfc4sfLwYPBMjSWVUwQOp60AYYXH6i8yCwuKFZ4rgK2i6pQek/b+bSyR7b01/922IBzQ=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
  <style>
    .tooltip {
      position: absolute;
      background: white;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>

<body>
<div class="container text-center">
  <h2 id="header"></h2>
  <br><br>
  <hr>

  <div class='row'>
    <div class="col-xs-12 col-lg-8" id="map"></div>
  </div>

  <br><br>
  <hr>
  <footer>
    <p style="font-size:12px">
      Copyright (C) Mats Melander
    </p>
  </footer>
</div>

<script>
function values(series, key) {
  let max_val, min_val;
  series[key].every(v => {
    if (v.active) {
      max_val = v.val;
      min_val = v.val;
      return false;
    }
    return true;
  });
  let stations = [];

  let idx = 0;
  series[key].forEach(function (p) {
    const lon = Math.round(p.lon * 100) / 100;
    const lat = Math.round(p.lat * 100) / 100;
    let found = stations.find(elem => elem.lon === lon && elem.lat === lat);
    if (!found && p.active) {
      stations.push({
        lon: lon,
        lat: lat,
        station: p.station,
        val: p.val,
        index: idx++   // <-- assign index
      });
      max_val = Math.max(max_val, p.val);
      min_val = Math.min(min_val, p.val);
    }
  });
  return {key: key, stns: stations, max: max_val, min: min_val, date: series.date};
}

$(document).ready(function () {
  $.when(
    $.get('clover/files/weather.json'),
    $.get('clover/files/se.json')
  ).done(function (data, se) {
    const key = 'temp';
    if (!(key in data[0])) {
      console.log(data);
      return;
    }
    let date = new Date(data[0].date);
    d3.select("#header").text("Temperatures " + date.toLocaleString("sv-SV"));

    // Map dimensions
    let containerWidth = document.getElementById('map').clientWidth;
    let mapHeight = containerWidth;
    const geojson_swe = topojson.feature(se[0], se[0].objects.subunits);
    let points = values(data[0], key);
    let colorScale = d3.scaleSequential()
      .interpolator(d3.interpolateSpectral)
      .domain([points.max, points.min]);
    let voronoi = d3.geoVoronoi().x(d => d.lon).y(d => d.lat);

    let projection = d3.geoEqualEarth();
    projection.fitSize([containerWidth, mapHeight], geojson_swe);

    let path = d3.geoPath().projection(projection);

    // SVG (will resize if legend below is needed)
    let svg = d3.select("#map")
      .append("svg")
      .attr("width", containerWidth)
      .attr("height", mapHeight);

    // Draw Sweden map
    svg.append('g').selectAll('path')
      .data(geojson_swe.features)
      .join('path')
      .attr('d', path)
      .style("fill", "#eee")
      .style("stroke", "#333");

    // ClipPath for Voronoi
    svg.append('defs')
      .append("clipPath")
      .attr("id", "swe-clip")
      .append("path")
      .attr("d", path(geojson_swe));

    // Tooltip div
    const tooltip = d3.select("body").append("div")
      .attr("class", "tooltip");

    // Voronoi diagram
    svg.append('g').selectAll("voronoi")
      .data(voronoi(points.stns).polygons().features)
      .enter()
      .append("path")
      .attr("clip-path", "url(#swe-clip)")
      .attr("d", path)
      .style('fill', function (d) {
        let i = d.properties.site.originalObject.index;
        return colorScale(points.stns[i].val);
      })
      .on("mousemove touchmove", function (event, d) {
        let i = d.properties.site.originalObject.index;
        let stn = points.stns[i];
        tooltip.style("opacity", 1)
          .html(stn.station + "<br/>Temp: " + stn.val)
          .style("left", (event.pageX + 10) + "px")
          .style("top", (event.pageY - 20) + "px");
      })
      .on("mouseout touchend", function () {
        tooltip.style("opacity", 0);
      });

    // Responsive legend placement
    let screenWidth = window.innerWidth;
    let legendX, legendY, legendCells, legendOrientation, fontSize, shapeWidth;

    if (screenWidth >= 768) {
      // Desktop / iPad landscape
      legendX = containerWidth - 60;
      legendY = 20;
      legendCells = 10;
      legendOrientation = "vertical";
      fontSize = "12px";
      shapeWidth = 20;

      svg.attr("height", mapHeight);
    } else {
      // Mobile / iPhone
      legendX = 20;
      legendY = mapHeight + 20;
      legendCells = 5;
      legendOrientation = "horizontal";
      fontSize = Math.max(10, Math.floor(screenWidth / 40)) + "px";
      shapeWidth = Math.max(30, screenWidth / legendCells / 1.5);

      svg.attr("height", mapHeight + 80);
    }

    let legend = d3.legendColor()
      .labelFormat(d3.format(".0f"))
      .cells(legendCells)
      .shapeWidth(shapeWidth)
      .scale(colorScale)
      .orient(legendOrientation);

    let legendGroup = svg.append("g")
      .attr("class", "legend")
      .attr("transform", `translate(${legendX}, ${legendY})`)
      .call(legend);

    legendGroup.selectAll("text").style("font-size", fontSize);
  });
});
</script>
</body>
</html>
